---
# Verify post-converge state for the runner_service role.
#
# Idempotence (the re-run reports changed: 0) is checked separately by
# `molecule idempotence` in the default test sequence; this file covers
# state assertions and the selector negative case.

- name: Verify - runner_service role post-conditions
  hosts: all
  gather_facts: false
  vars:
    declared_runners:
      - runner-install
      - runner-active
      - runner-stopped
    # Re-declared rather than inherited: converge.yml's play vars are
    # out of scope here, and the environment-refresh case below has to
    # apply the role a second time. Only the three fields the role and
    # its runner_entry_resolve dep read are repeated; the entry shape
    # itself is covered by the runner_entry_resolve scenario.
    github_runners_config:
      - vmName: instance
        runnerName: runner-install
        runnerUsername: u-runner-shared
      - vmName: instance
        runnerName: runner-active
        runnerUsername: u-runner-shared
      - vmName: instance
        runnerName: runner-stopped
        runnerUsername: u-runner-other
  tasks:
    # Every declared runner on `instance` has a matching unit file.
    # The role's probe runs the same glob; if the unit is missing the
    # install branch left work undone.
    - name: Stat the unit file for each declared runner
      ansible.builtin.stat:
        path: >-
          /etc/systemd/system/actions.runner.example-repo.{{
          item }}.service
      register: unit_stats
      loop: "{{ declared_runners }}"
      loop_control:
        label: "{{ item }}"

    - name: Assert every declared runner has its unit file
      ansible.builtin.assert:
        that:
          - >-
            (unit_stats.results | map(attribute='stat.exists') | list)
            == [true, true, true]
        fail_msg: >-
          One or more runner units is missing under
          /etc/systemd/system:
          {{ unit_stats.results | map(attribute='stat.exists') | list }}

    # is-active per declared runner. The role's re-check asserts the
    # same condition; verifying again here proves the active state
    # survived past the role's own assertion (a unit that activated
    # then immediately failed would surface as the next is-active
    # returning something other than 'active').
    - name: Capture systemctl is-active for each declared runner  # noqa command-instead-of-module
      ansible.builtin.command:
        cmd: >-
          systemctl is-active
          actions.runner.example-repo.{{ item }}.service
      register: active_checks
      loop: "{{ declared_runners }}"
      loop_control:
        label: "{{ item }}"
      changed_when: false

    - name: Assert every declared runner service is active
      ansible.builtin.assert:
        that:
          - (item.stdout | trim) == 'active'
        fail_msg: >-
          Runner unit
          actions.runner.example-repo.{{ item.item }}.service is not
          active (systemctl is-active reported
          '{{ item.stdout | trim }}').
      loop: "{{ active_checks.results }}"
      loop_control:
        label: "{{ item.item }}"

    # Selector negative: the runner-leak entry was declared on a
    # different vmName and must not have produced a unit on `instance`.
    # A leaked unit file would mean runner_entry_resolve's selectattr
    # let an out-of-host entry through.
    - name: Stat the leak runner's unit (must not exist)
      ansible.builtin.stat:
        path: >-
          /etc/systemd/system/actions.runner.example-repo-leak.runner-leak.service
      register: leak_unit_stat

    - name: Assert runner-leak did not leak onto this host
      ansible.builtin.assert:
        that:
          - not leak_unit_stat.stat.exists
        fail_msg: >-
          /etc/systemd/system/actions.runner.example-repo-leak.runner-leak.service
          exists; the runner_entry_resolve selectattr let an entry for
          vmName=other-host through.

    # Glob check on the unit-file listing: only the three declared
    # units exist; no leak unit was registered under any other name
    # pattern either. Catches a future stub change that might rename
    # the unit prefix in a way the path-stat above would miss.
    - name: List installed actions.runner units  # noqa command-instead-of-module
      ansible.builtin.command:
        cmd: >-
          systemctl list-unit-files
          --type=service --no-pager --no-legend
          'actions.runner.*'
      register: actions_runner_units
      changed_when: false

    - name: Assert exactly the three declared units are installed
      ansible.builtin.assert:
        that:
          - actions_runner_units.stdout_lines | length == 3
          - >-
            (actions_runner_units.stdout_lines
             | join(' ') | regex_search('runner-leak')) is none
        fail_msg: >-
          Unexpected actions.runner unit set after converge:
          {{ actions_runner_units.stdout_lines }}

    # Environment delivery. Asserting the drop-in file exists proves
    # only that the role rendered it; the dumps below are what prove
    # systemd actually read /etc/environment into the unit's exec
    # environment, which is the thing the feature was added for.
    - name: Read the environment drop-in for each declared runner
      ansible.builtin.slurp:
        src: >-
          /etc/systemd/system/actions.runner.example-repo.{{ item
          }}.service.d/10-environment-file.conf
      register: dropin_files
      loop: "{{ declared_runners }}"
      loop_control:
        label: "{{ item }}"

    - name: Assert every drop-in points at /etc/environment
      ansible.builtin.assert:
        that:
          - >-
            'EnvironmentFile=-/etc/environment'
            in (item.content | b64decode)
        fail_msg: >-
          The drop-in for {{ item.item }} does not carry the
          EnvironmentFile line:
          {{ item.content | b64decode }}
      loop: "{{ dropin_files.results }}"
      loop_control:
        label: "{{ item.item }}"

    # The stub unit's ExecStart dumps its environment on every start.
    # runner-active is the interesting entry here: prepare started it
    # before the role existed on this host, so its dump only carries the
    # variable because the role noticed the new drop-in and restarted it.
    - name: Read the environment dump each runner unit was started with
      ansible.builtin.slurp:
        src: "/tmp/runner-env-{{ item }}.txt"
      register: env_dumps
      loop: "{{ declared_runners }}"
      loop_control:
        label: "{{ item }}"

    - name: Assert every runner unit received the declared variable
      ansible.builtin.assert:
        that:
          - >-
            'MOLECULE_RUNNER_ENV=seeded-by-prepare'
            in (item.content | b64decode)
        fail_msg: >-
          Unit for {{ item.item }} started without MOLECULE_RUNNER_ENV;
          the EnvironmentFile drop-in did not reach it.
      loop: "{{ env_dumps.results }}"
      loop_control:
        label: "{{ item.item }}"

    # The recorded checksum is what lets the next run tell a stale unit
    # from a current one. A record that does not match the file it
    # describes would make the role either restart on every run or never
    # restart at all, and neither shows up as a failure anywhere else.
    - name: Stat /etc/environment for its checksum
      ansible.builtin.stat:
        path: /etc/environment
      register: environment_stat

    - name: Read the recorded environment checksum for each runner
      ansible.builtin.slurp:
        src: "/opt/runners/{{ item }}/.environment-checksum"
      register: checksum_records
      loop: "{{ declared_runners }}"
      loop_control:
        label: "{{ item }}"

    - name: Assert each record matches the current /etc/environment
      ansible.builtin.assert:
        that:
          - >-
            (item.content | b64decode | trim)
            == environment_stat.stat.checksum
        fail_msg: >-
          /opt/runners/{{ item.item }}/.environment-checksum holds
          '{{ item.content | b64decode | trim }}' but /etc/environment
          checksums to '{{ environment_stat.stat.checksum }}'.
      loop: "{{ checksum_records.results }}"
      loop_control:
        label: "{{ item.item }}"

    # Stale-environment case. Mutating state, so it lives here rather
    # than in converge.yml: `molecule idempotence` runs converge twice
    # and a converge that edits /etc/environment would report changed on
    # the second pass by construction.
    #
    # EnvironmentFile is read at unit START, so this edit reaches a
    # running unit only if the role compares the file against its record
    # and restarts. Without that comparison every assertion above still
    # passes and the first CI job after an operator edits /etc/environment
    # silently runs with the old value.
    - name: Change the declared variable in /etc/environment
      ansible.builtin.lineinfile:
        path: /etc/environment
        regexp: '^MOLECULE_RUNNER_ENV='
        line: 'MOLECULE_RUNNER_ENV="changed-in-verify"'

    - name: Re-apply the role against the changed environment
      ansible.builtin.include_role:
        name: runner_service

    - name: Re-read the environment dump for each runner unit
      ansible.builtin.slurp:
        src: "/tmp/runner-env-{{ item }}.txt"
      register: env_dumps_after_change
      loop: "{{ declared_runners }}"
      loop_control:
        label: "{{ item }}"

    - name: Assert every runner unit picked up the changed variable
      ansible.builtin.assert:
        that:
          - >-
            'MOLECULE_RUNNER_ENV=changed-in-verify'
            in (item.content | b64decode)
        fail_msg: >-
          Unit for {{ item.item }} is still carrying the environment it
          started with; the role did not restart it after
          /etc/environment changed.
      loop: "{{ env_dumps_after_change.results }}"
      loop_control:
        label: "{{ item.item }}"
