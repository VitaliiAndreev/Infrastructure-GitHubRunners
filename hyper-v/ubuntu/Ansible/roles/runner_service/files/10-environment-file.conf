# Managed by Infrastructure-GitHubRunners (roles/runner_service).
# Manual edits are overwritten on the next register-runners run.
#
# Why this file exists: actions/runner's `svc.sh install` generates a
# unit with no EnvironmentFile=, and the runsvc.sh it launches sources
# only `.path`. /etc/environment - where the VM's declared environment
# variables land (Common-Ansible's vm_env_vars role, or the PowerShell
# transport's managed block) - is read by PAM's pam_env for login
# sessions only, never by a systemd system service. So without this
# drop-in a variable is visible over SSH and absent from every workflow
# job on the same host.
#
# The leading '-' makes a missing /etc/environment non-fatal, so the
# drop-in is safe to render on a host that has never run the
# provision-env flow.
[Service]
EnvironmentFile=-/etc/environment
