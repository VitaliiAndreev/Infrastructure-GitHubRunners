name: Infrastructure-E2E

# Calls the shared E2E workflow in Infrastructure-E2E as a required PR check.
# Always runs the full lifecycle layer - a runners change can cascade to break
# user setup or provisioning, so the full stack must be verified.
#
# Pins runnersFlow=ansible so this repo's PR exercises its Ansible runner flow
# (register-runners.sh / deregister-runners.sh / runner-status.sh on the
# Common-Ansible substrate); that flow needs WslDistro in the E2EConfig vault.
# usersFlow is also ansible - the user owner's check exercises that flow - so a
# runner PR runs the full Ansible stack with the runner flow as the variable
# under test. This pin does not cover the PowerShell register-runners.ps1 path -
# use an explicit override or a matrix for that.
on:
  pull_request:

jobs:
  e2e:
    uses: Klark-Morrigan/Infrastructure-E2E/.github/workflows/e2e.yml@master
    secrets: inherit
    with:
      flow-spec: '{"usersFlow":"ansible","runnersFlow":"ansible"}'
