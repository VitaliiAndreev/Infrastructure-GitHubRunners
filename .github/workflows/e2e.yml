name: Infrastructure-E2E

# Calls the shared E2E workflow in Infrastructure-E2E as a required PR check.
# Always runs the full lifecycle layer - a runners change can cascade to break
# user setup or provisioning, so the full stack must be verified.
#
# Pins runnersFlow=ansible so this repo's PR exercises its Ansible runner flow
# (register-runners.sh / deregister-runners.sh / runner-status.sh on the
# Common-Ansible substrate); that flow needs WslDistro in the E2EConfig vault.
# usersFlow, toolchainsFlow, filesFlow and envVarsFlow are also ansible - their
# owners' checks exercise those flows - so a runner PR runs the full Ansible
# stack with the runner flow as the variable under test. The toolchain flow runs
# provision-toolchains.sh against the Common-Ansible jdk / dotnet_sdk /
# dotnet_tools roles; the files flow runs provision-files.sh against the vm_files
# role; the env flow runs provision-env.sh against the vm_env_vars role. This pin
# does not cover the PowerShell register-runners.ps1 path - use an explicit
# override or a matrix for that.
#
# The env layer is worth pinning here rather than left to default even though
# the default is the same value: this repo owns the DELIVERY half of that story
# (roles/runner_service's systemd drop-in and its restart-on-change), so a
# reader of this file should see that the layer whose output its runners consume
# is under test rather than have to know the agent's defaults.
on:
  pull_request:

jobs:
  e2e:
    uses: Klark-Morrigan/Infrastructure-E2E/.github/workflows/e2e.yml@master
    secrets: inherit
    with:
      flow-spec: >-
        {
          "usersFlow":"ansible",
          "runnersFlow":"ansible",
          "toolchainsFlow":"ansible",
          "filesFlow":"ansible",
          "envVarsFlow":"ansible"
        }
